<body><header class="site-header"><div class="wrap">

<main><div class="wrap"><section class="keeper-note" aria-labelledby="note-label"><div class="label" id="note-label">책방지기 노트</div>
  <blockquote>새벽 산책길에서 이 책을 처음 펼쳤어요. 서두르지 않는 문장들이 발걸음을 늦추게 해요. 계절이 바뀌는 길목에 있는 분께 건네고 싶은 책입니다.</blockquote>
  <div class="sign">ㅡ 책방지기</div></section>
<div class="split" style="--cols: 280px 1fr; margin-top:40px">
  <div class="detail-cover"><div class="cover"><svg viewBox="0 0 150 200" role="img" aria-label="숲의 시간을 걷다 표지" preserveAspectRatio="xMidYMid slice">
  <rect width="150" height="200" fill="#dfe6d5"/>
  <rect x="0" y="0" width="6" height="200" fill="#2f5038" opacity=".18"/>
  <path d="M60 118c-22-30-6-62 28-70 6 34-6 60-28 70z" fill="none" stroke="#2f5038" stroke-width="3"/><path d="M60 118c8-24 16-42 28-70" stroke="#2f5038" stroke-width="2" fill="none"/>
  <text x="20" y="160" font-family="Gowun Batang, serif" font-weight="700" font-size="15" fill="#2f5038">숲의 시간을</text>
  <text x="20" y="180" font-family="Gowun Batang, serif" font-weight="700" font-size="15" fill="#2f5038">걷다</text>
</svg></div></div>
  <div><h1>숲의 시간을 걷다</h1><p class="muted" style="margin-top:6px">예시 저자</p>
    <div style="display:flex;gap:12px;align-items:center;margin-top:16px"><span class="badge theme-nature">자연</span><span style="font-size:1.25rem">16,800원</span></div>
    <p style="margin-top:20px;max-width:34em">숲길을 걸으며 기록한 계절의 짧은 글 모음. (예시 설명)</p>
    <button class="btn btn-primary btn-lg" style="margin-top:24px;min-width:220px">장바구니 담기</button>
    <details style="margin-top:32px;border-top:1px solid var(--border);padding-top:16px"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center">출판사 소개</summary></details>
    <p style="margin-top:24px"><a class="link" href="#">테마 서가로 돌아가기</a></p></div>
