<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-07 기본 배송지 시안</title><link rel="stylesheet" href="../src/mockup.css"></head>
<body><header class="site-header"><div class="wrap">
  <a class="logo" href="#">우분투북스<small>대전 어은동</small></a>
  <nav class="nav nav-main" aria-label="주 메뉴"><a href="#">테마 서가</a><a href="#">편지 띄우기</a></nav>
  <nav class="nav" aria-label="내 메뉴"><a href="#">장바구니<span class="count" aria-label="담은 책 2권">2</span></a><a href="#" aria-current="page">마이페이지</a></nav>
</div></header>
<main><div class="wrap wrap-narrow"><h1>기본 배송지</h1><p class="lead" style="margin-top:8px">주문과 편지 띄우기에 이 주소를 먼저 채워 드려요. 이미 한 주문의 주소는 바뀌지 않아요.</p>
<form class="stack" style="margin-top:28px">
  <label class="field"><span>받는 사람</span><input class="input" value="김예시"></label>
  <label class="field field-error"><span>연락처</span><input class="input" value="" aria-invalid="true"><div class="error-text">연락처를 적어 주세요</div></label>
  <label class="field"><span>주소</span><input class="input" value="대전 유성구 예시로 00"></label>
  <button class="btn btn-primary" type="button">저장</button></form></div></main>
<footer class="site-footer"><div class="wrap">
  <div><strong>우분투북스</strong><div>대전 어은동 골목 안쪽의 작은 책방</div></div>
  <nav aria-label="사이트 링크"><a class="link" href="#">테마 서가</a><a class="link" href="#">편지 띄우기</a></nav>
</div></footer>
<div class="mock-tag">SCR-07 시안 / 예시 데이터</div>
</body></html>
