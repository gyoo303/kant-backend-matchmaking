<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-10 주문서·결제 시안</title><link rel="stylesheet" href="../src/mockup.css"></head>
<body><header class="site-header"><div class="wrap">
  <a class="logo" href="#">우분투북스<small>대전 어은동</small></a>
  <nav class="nav nav-main" aria-label="주 메뉴"><a href="#">테마 서가</a><a href="#">편지 띄우기</a></nav>
  <nav class="nav" aria-label="내 메뉴"><a href="#" aria-current="page">장바구니<span class="count" aria-label="담은 책 2권">2</span></a><a href="#">마이페이지</a></nav>
</div></header>
<main><div class="wrap"><h1>주문서</h1><div class="split" style="--cols: 1fr 320px; margin-top:28px"><div>
<h2 style="font-size:1.25rem">주문할 책</h2><div class="row-list" style="margin-top:12px">
<div style="display:flex;justify-content:space-between"><span>제철 부엌 일기 × 2</span><span>36,000원</span></div>
<div style="display:flex;justify-content:space-between"><span>작은 습지의 사계 × 2</span><span>44,000원</span></div></div>
<h2 style="font-size:1.25rem;margin-top:36px">받는 곳</h2><p class="hint">기본 배송지를 채워 두었어요</p>
<div class="stack" style="margin-top:12px"><label class="field"><span>받는 사람</span><input class="input" value="김예시"></label>
<label class="field"><span>연락처</span><input class="input" value="010-0000-0000"></label>
<label class="field"><span>주소</span><input class="input" value="대전 유성구 예시로 00"></label></div></div>
<aside class="summary"><dl><dt>합계</dt><dd class="total">80,000원</dd></dl><p class="hint">카드·간편결제 (테스트 결제)</p>
<button class="btn btn-primary btn-block btn-lg" style="margin-top:20px">결제하기</button></aside></div></div></main>
<footer class="site-footer"><div class="wrap">
  <div><strong>우분투북스</strong><div>대전 어은동 골목 안쪽의 작은 책방</div></div>
  <nav aria-label="사이트 링크"><a class="link" href="#">테마 서가</a><a class="link" href="#">편지 띄우기</a></nav>
</div></footer>
<div class="mock-tag">SCR-10 시안 / 예시 데이터</div>
</body></html>
