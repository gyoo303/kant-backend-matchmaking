<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-13 관리자 주문 처리 시안</title><link rel="stylesheet" href="../src/mockup.css"></head>
<body><header class="admin-bar"><div class="wrap">
  <a class="logo" href="#">우분투북스<small>책방지기 서재</small></a>
  <nav aria-label="관리자 메뉴"><a href="#">책 관리</a><a href="#" aria-current="page">주문 처리</a><a href="#">서재 작업</a></nav>
</div></header>
<main><div class="wrap wrap-narrow"><div class="section-head"><h1>주문 처리</h1><button class="btn btn-outline">주소록 내려받기</button></div>
<p class="muted">오래된 주문부터 보여요.</p><div style="margin-top:20px">
<div class="order"><div class="order-head"><strong>숲의 시간을 걷다 × 1</strong><span class="badge badge-plain">주문 접수</span></div>
<p class="small muted" style="margin-top:8px">김예시 / 010-0000-0000 / 대전 유성구 예시로 00</p><button class="btn btn-primary" style="margin-top:14px">발송 완료</button></div>
<div class="order" style="border-color:var(--destructive)"><div class="order-head"><strong>골목을 산책하는 법 × 1</strong><span class="badge badge-plain" style="background:var(--destructive-soft);color:var(--destructive-soft-foreground)">취소 요청</span></div>
<p class="small muted" style="margin-top:8px">이예시 / 010-0000-0001 / 대전 유성구 예시로 01</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-destructive">환불</button><button class="btn btn-outline">취소 거절</button><button class="btn" disabled>발송 완료</button></div>
<p class="hint">취소 요청이 있는 주문이에요. 환불하거나 거절해 주세요</p></div></div></div></main>

<div class="mock-tag">SCR-13 시안 / 예시 데이터</div>
</body></html>
