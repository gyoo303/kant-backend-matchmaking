{# 보관 정보: 삭제된 방의 내 참가 기록 (읽기 전용, SCR-06) #}
{% extends "base.html" %}

{% block title %}보관 정보 · TAG TEAM{% endblock %}
{% block require_login %}true{% endblock %}

{% block content %}
<section id="archived" class="card" data-room-id="{{ room_id }}" hidden>
  <h1 id="archived-title" class="section-title"></h1>

  <div class="table-wrap">
    <table>
      <tbody>
        <tr><th>정원</th><td id="archived-capacity"></td></tr>
        <tr><th>생성 시각</th><td id="archived-created-at"></td></tr>
        <tr><th>삭제 시각</th><td id="archived-deleted-at"></td></tr>
      </tbody>
    </table>
  </div>

  <h3>본인 입장·퇴장 기록</h3>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th class="nowrap">입장 시각</th><th class="nowrap">퇴장 시각</th></tr>
      </thead>
      <tbody id="archived-records"></tbody>
    </table>
  </div>

  <p><a href="/me/history" class="button secondary">내 기록으로</a></p>
</section>
{% endblock %}

{% block scripts %}
<script>
  // 사용자 값은 textContent로만 넣는다 (innerHTML 금지, RISK-10)
  function drawRecordRow(record) {
    const tr = document.createElement("tr");
    for (const text of [formatTime(record.joined_at), record.left_at ? formatTime(record.left_at) : "-"]) {
      const td = document.createElement("td");
      td.className = "nowrap";
      td.textContent = text;
      tr.appendChild(td);
    }
    return tr;
  }

  async function loadArchived() {
    if (!getAccessToken()) return; // 로그인 이동은 base.html·api.js가 처리한다

    const section = document.getElementById("archived");
    const roomId = section.dataset.roomId;
    const result = await apiRequest("GET", "/api/me/room-history/" + roomId);

    if (result.status === 404) {
      showNotice("찾을 수 없습니다", "error"); // 서버 detail 대신 화면 문구 (PAGE-06)
      return;
    }
    if (!result.ok) {
      showNotice(errorMessage(result), "error");
      return;
    }

    const room = result.data;
    document.getElementById("archived-title").textContent = room.title;
    document.getElementById("archived-capacity").textContent = room.capacity + "명";
    document.getElementById("archived-created-at").textContent = formatTime(room.created_at);
    document.getElementById("archived-deleted-at").textContent = formatTime(room.deleted_at);
    document.getElementById("archived-records").replaceChildren(...room.my_records.map(drawRecordRow));
    section.hidden = false;
  }

  loadArchived();
</script>
{% endblock %}
